<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Maya</title>
    <style>
        :root {
            --calc-body: #2d2d2d;
            --screen-bg: #8ba888;
            --screen-text: #1a1c1a;
            --btn-num: #e0e0e0;
            --btn-op: #cccccc;
            --btn-sci: #4a4a4a;
            --btn-eq: #f2a154;
            --btn-toggle: #54a2f2;
            --glyph-color: #1a1c1a;
        }

        body {
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .main-wrapper {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            max-width: 1100px;
            width: 100%;
        }

        .side-panel {
            background: var(--calc-body);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .side-panel h2 {
            margin: 0 0 10px 0;
            color: var(--btn-eq);
            font-size: 1.3rem;
            text-align: center;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }

        .side-panel lnk {
            margin: 0 0 10px 0;
            color: var(--btn-eq);
            font-size: 1.3rem;
            text-align: center;
        }

        .converter-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #ccc;
        }

        .converter-group input, .info-textarea {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #1e1e1e;
            color: #fff;
            font-family: monospace;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .info-textarea {
            resize: vertical;
            min-height: 200px;
            font-family: 'Segoe UI', sans-serif;
        }

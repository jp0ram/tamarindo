<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<nav><a href="https://tamarindo.cc">← Tamarindo.cc</a><a href="index.html" class="on">Vinyls</a><a href="cards.html">Playing cards</a></nav>
<header class="top"><h1>Vinyl collection</h1><p>Click a cover to open the album on YouTube Music.</p></header>
<main id="list"></main>
<footer>Tracklists marked “verify” are from memory — please check them.</footer>
<script>
const A=[
{img:"2001.jpg",t:"2001: A Space Odyssey (Original Soundtrack)",y:"1968",g:"Film soundtrack, classical",v:1,s:["Also sprach Zarathustra","The Blue Danube","Gayane Ballet Suite: Adagio","Requiem","Lux Aeterna","Atmospheres"]},
{img:"abnormal.jpg",t:"Abnormal",y:"?",g:"?",v:1,s:[]},
{img:"am.jpg",t:"AM",a:"Arctic Monkeys",y:"2013",g:"Indie rock",s:["Do I Wanna Know?","R U Mine?","One for the Road","Arabella","I Want It All","No. 1 Party Anthem","Mad Sounds","Fireside","Why'd You Only Call Me When You're High?","Snap Out of It","Knee Socks","I Wanna Be Yours"]},
{img:"awaken.jpg",t:"Awaken, My Love!",a:"Childish Gambino",y:"2016",g:"Funk, psychedelic soul",s:["Me and Your Mama","Have Some Love","Boogieman","Zombies","Riot","Redbone","California","Terrified","Baby Boy","The Night Me and Your Mama Met","Stand Tall"]},
{img:"favworst.jpg",t:"Favourite Worst Nightmare",a:"Arctic Monkeys",y:"2007",g:"Indie rock, garage rock",s:["Brianstorm","Teddy Picker","D Is for Dangerous","Balaclava","Fluorescent Adolescent","Only Ones Who Know","Do Me a Favour","This House Is a Circus","If You Were There, Beware","The Bad Thing","Old Yellow Bricks","505"]},
{img:"friends.jpg",t:"Friends",y:"?",g:"?",v:1,s:[]},
{img:"gil.jpg",t:"Gilberto & Jobim",y:"1960s",g:"Bossa nova",v:1,s:["Corcovado","Meditação"]},
{img:"igor.jpg",t:"IGOR",a:"Tyler, the Creator",y:"2019",g:"Hip hop, art pop",s:["IGOR'S THEME","EARFQUAKE","I THINK","EXACTLY WHAT YOU RUN FROM YOU END UP CHASING","RUNNING OUT OF TIME","NEW MAGIC WAND","A BOY IS A GUN*","PUPPET","WHAT'S GOOD","GONE, GONE / THANK YOU","I DON'T LOVE YOU ANYMORE","ARE WE STILL FRIENDS?"]},
{img:"molchat.jpg",t:"Монумент (Monument)",a:"Molchat Doma",y:"2020",g:"Post-punk, synth-pop",v:1,s:[]},
{img:"moon.jpg",t:"Man on the Moon: The Flight of Apollo 11",y:"1969",g:"Spoken word, historical recording",v:1,s:[]},
{img:"ponyo.jpeg",t:"Ponyo on the Cliff by the Sea (Soundtrack)",a:"Joe Hisaishi",y:"2008",g:"Film soundtrack, orchestral",v:1,s:[]},
{img:"salad.jpg",t:"Salad Days",a:"Mac DeMarco",y:"2014",g:"Indie rock, jangle pop",s:["Salad Days","Blue Boy","Brother","Let Her Go","Goodbye Weekend","Let My Baby Stay","Passing Out Pieces","Treat Her Better","Chamber of Reflection","Go Easy","Jonny's Odyssey"]},
{img:"sinatra.jpg",t:"Francis Albert Sinatra & Antonio Carlos Jobim",a:"Frank Sinatra, Antonio Carlos Jobim",y:"1967",g:"Bossa nova, vocal jazz",s:["The Girl from Ipanema","Dindi","Change Partners","Quiet Nights of Quiet Stars (Corcovado)","Meditation (Meditação)","If You Never Come to Me (Inútil paisagem)","How Insensitive (Insensatez)","I Concentrate on You","Baubles, Bangles and Beads","Once I Loved (O amor em paz)"]},
{img:"thecar.jpg",t:"The Car",a:"Arctic Monkeys",y:"2022",g:"Art pop, lounge, baroque pop",s:["There'd Better Be a Mirrorball","I Ain't Quite Where I Think I Am","Sculptures of Anything Goes","Jet Skis on the Moat","Body Paint","The Car","Big Ideas","Hello You","Mr Schwartz","Perfect Sense"]}
];
const e=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("list").innerHTML=A.map(x=>{
 const q=encodeURIComponent((x.a?x.a+" ":"")+x.t+" album");
 return `<article class="album"><a class="cover" href="https://music.youtube.com/search?q=${q}" target="_blank" rel="noopener" aria-label="Open ${e(x.t)} on YouTube Music"><img src="vinyls/${x.img}" alt="Cover of ${e(x.t)}"></a>
 <div class="info"><h2>${e(x.t)}</h2><p class="meta">${x.a?e(x.a)+" — ":""}<b>${e(x.y)}</b> — ${e(x.g)}${x.v?'<span class="tag">verify</span>':""}</p>
 ${x.s.length?"<ol>"+x.s.map(s=>"<li>"+e(s)+"</li>").join("")+"</ol>":"<p class='meta'>Tracklist to be added.</p>"}</div></article>`}).join("");
</script></body></html>
